# Builds the desktop binaries of Mental-Rotation-Preparation on every push and
# pull request, and attaches them to a GitHub Release when a tag v* is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
#   mental-rotation-preparation-linux        Linux x86-64
#   mental-rotation-preparation-macos-arm64  macOS, Apple silicon
#   mental-rotation-preparation-macos-amd64  macOS, Intel
#   mental-rotation-preparation-windows.exe  Windows x86-64
#   SHA256SUMS
#
# go-sdl3 embeds the SDL libraries for every platform and needs no cgo, so all
# targets cross-compile from one Linux runner. The browser build is deployed by
# the separate pages.yml.
#
# NOTE: GitHub only runs workflows found in .github/workflows at the ROOT of a
# repository. This file takes effect once this folder is its own repository.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile
        run: ./build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mental-rotation-preparation-*
            dist/SHA256SUMS
