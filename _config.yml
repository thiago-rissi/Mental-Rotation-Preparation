theme: jekyll-theme-cayman

# The site is README.md (the report), figures/ and, added by
# .github/workflows/pages.yml after the Jekyll build, the browser version of
# the experiment in experiment/. Everything else stays out of the site.
exclude:
  - "*.go"
  - go.mod
  - go.sum
  - Makefile
  - build.sh
  - meta.yaml
  - assets/Inconsolata.ttf
  - assets/FONT-LICENSE.md
  - data
  - dist
  - paper
  - scripts
  - web
